apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-lab-apps
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/borishasselmann/k8s-lab.git
    targetRevision: main
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
