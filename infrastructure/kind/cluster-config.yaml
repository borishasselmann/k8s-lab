# kind cluster configuration for k8s-lab
# Docs: https://kind.sigs.k8s.io/docs/user/configuration/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Map port 80 on the host to port 80 on the node
    # Required for Traefik ingress to be accessible via *.localhost
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
