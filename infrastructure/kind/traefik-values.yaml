# Traefik Helm values for kind cluster
# Matches the built-in Traefik behavior of k3d/k3s

# Use hostPort to bind directly to the node's port 80
# Works with kind's extraPortMappings
ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
    hostPort: 80
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
    hostPort: 443

# Run on nodes labeled ingress-ready=true (the control-plane in kind)
nodeSelector:
  ingress-ready: "true"

# Tolerate control-plane taints so Traefik can run on the kind node
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

# Single replica is sufficient for local development
# Recreate strategy required because hostPort can only be bound by one pod at a time
deployment:
  replicas: 1
updateStrategy:
  type: Recreate

# Disable TLS redirect for local development (matches k3d behavior)
ingressRoute:
  dashboard:
    enabled: false

# Use ClusterIP since we use hostPort (LoadBalancer stays <pending> in kind)
service:
  type: ClusterIP

# Set ingress status to "localhost" so ArgoCD sees Ingress resources as Healthy
# (kind has no LoadBalancer controller, so publishedService won't work)
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
additionalArguments:
  - "--providers.kubernetesingress.ingressendpoint.hostname=localhost"
