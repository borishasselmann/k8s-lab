# Jaeger v2 with OpenTelemetry Collector
# Chart: https://github.com/jaegertracing/helm-charts/tree/main/charts/jaeger

# Jaeger v2 uses OTEL Collector config format
config:
  extensions:
    jaeger_storage:
      backends:
        primary_store:
          elasticsearch:
            server_urls: ["http://elasticsearch.logging.svc.cluster.local:9200"]
        archive_store:
          elasticsearch:
            server_urls: ["http://elasticsearch.logging.svc.cluster.local:9200"]
    jaeger_query:
      storage:
        traces: primary_store
        traces_archive: archive_store
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp, jaeger, zipkin]
        processors: [batch]
        exporters: [jaeger_storage_exporter]
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        grpc:
    zipkin:
  processors:
    batch:
  exporters:
    jaeger_storage_exporter:
      trace_storage: primary_store

# Don't provision datastores - we use external ES
provisionDataStore:
  cassandra: false
  elasticsearch: false

# Jaeger deployment settings
jaeger:
  enabled: true
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - jaeger.localhost

# Disable maintenance jobs (esIndexCleaner needs different config in v2)
esIndexCleaner:
  enabled: false

esRollover:
  enabled: false

esLookback:
  enabled: false

spark:
  enabled: false
