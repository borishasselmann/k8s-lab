# Bitnami Elasticsearch Single Node for k3d
# Chart: https://github.com/bitnami/charts/tree/main/bitnami/elasticsearch

# Use bitnamilegacy images (Bitnami moved to paid registry Aug 2025)
image:
  registry: docker.io
  repository: bitnamilegacy/elasticsearch
  tag: 9.1.2-debian-12-r0

# Init containers using bitnamilegacy images
volumePermissions:
  enabled: false  # Not needed without persistence
  registry: docker.io
  repository: bitnamilegacy/os-shell
  tag: 12-debian-12-r51
sysctlImage:
  enabled: true
  registry: docker.io
  repository: bitnamilegacy/os-shell
  tag: 12-debian-12-r51

# Single node with all roles (master + data + ingest)
master:
  replicaCount: 1
  # Enable master node to also be data node
  masterOnly: false
  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  persistence:
    enabled: false
  heapSize: 1024m
  # Single node mode
  extraEnvVars:
    - name: "discovery.type"
      value: "single-node"

# Cluster settings for single node
extraConfig:
  action.auto_create_index: "true"

# Disable other node types for single-node setup
data:
  replicaCount: 0
coordinating:
  replicaCount: 0
ingest:
  replicaCount: 0

# Security disabled for local dev
security:
  enabled: false
  tls:
    restEncryption: false

# Ingress
ingress:
  enabled: true
  ingressClassName: traefik
  hostname: elasticsearch.localhost

# Metrics for Prometheus (optional)
metrics:
  enabled: false

# Kibana (bundled subchart)
kibana:
  enabled: true
  # Use bitnamilegacy images
  image:
    registry: docker.io
    repository: bitnamilegacy/kibana
    tag: 9.1.2-debian-12-r0
  # Init container image (copy-default-plugins)
  volumePermissions:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r51
  # Single replica for local dev
  replicaCount: 1
  # Resources
  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  # Health probes - Kibana needs longer startup time
  livenessProbe:
    enabled: true
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
  # Ingress
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: kibana.localhost
  # Persistence
  persistence:
    enabled: false
  # Security context
  podSecurityContext:
    enabled: true
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # ServiceAccount
  serviceAccount:
    create: true
    automountServiceAccountToken: false
  # PDB disabled for single replica
  pdb:
    create: false
