# Bitnami Elasticsearch Single Node for k3d
# Chart: https://github.com/bitnami/charts/tree/main/bitnami/elasticsearch

# Global settings
global:
  kibanaEnabled: true

# Use bitnamilegacy images (Bitnami moved to paid registry Aug 2025)
image:
  registry: docker.io
  repository: bitnamilegacy/elasticsearch
  tag: 9.1.2-debian-12-r0

# Init containers using bitnamilegacy images
volumePermissions:
  enabled: false  # Not needed without persistence
  registry: docker.io
  repository: bitnamilegacy/os-shell
  tag: 12-debian-12-r51
sysctlImage:
  enabled: true
  registry: docker.io
  repository: bitnamilegacy/os-shell
  tag: 12-debian-12-r51

# Single node with all roles (master + data + ingest)
master:
  replicaCount: 1
  # Enable master node to also be data node
  masterOnly: false
  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  persistence:
    enabled: false
  heapSize: 1024m
  # Single node mode
  extraEnvVars:
    - name: "discovery.type"
      value: "single-node"

# Cluster settings for single node
extraConfig:
  action.auto_create_index: "true"

# Disable other node types for single-node setup
data:
  replicaCount: 0
coordinating:
  replicaCount: 0
ingest:
  replicaCount: 0

# Security disabled for local dev
security:
  enabled: false
  tls:
    restEncryption: false

# Ingress
ingress:
  enabled: true
  ingressClassName: traefik
  hostname: elasticsearch.localhost

# Metrics for Prometheus (optional)
metrics:
  enabled: false

# Kibana (bundled subchart - enabled via global.kibanaEnabled)
# Note: Only elasticsearch connection params are configurable here
# For full Kibana customization, use separate kibana deployment
kibana:
  elasticsearch:
    hosts:
      - '{{ include "elasticsearch.service.name" . }}'
    port: '{{ include "elasticsearch.service.ports.restAPI" . }}'
