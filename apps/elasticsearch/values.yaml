# Bitnami Elasticsearch Single Node for k3d
# Chart: https://github.com/bitnami/charts/tree/main/bitnami/elasticsearch

# Use bitnamilegacy images (Bitnami moved to paid registry Aug 2025)
image:
  registry: docker.io
  repository: bitnamilegacy/elasticsearch
  tag: 9.1.2-debian-12-r0

# Init containers using bitnamilegacy images
volumePermissions:
  enabled: false  # Not needed without persistence
  registry: docker.io
  repository: bitnamilegacy/os-shell
  tag: 12-debian-12-r51
sysctlImage:
  enabled: true
  registry: docker.io
  repository: bitnamilegacy/os-shell
  tag: 12-debian-12-r51

# Single master node (no data/coordinating separation)
master:
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  persistence:
    enabled: false
  heapSize: 1024m
  # Single node: set replicas to 0 so indices can be green
  extraEnvVars:
    - name: "discovery.type"
      value: "single-node"

# Index settings for single node (no replicas)
extraConfig:
  action.auto_create_index: "true"
  index.number_of_replicas: "0"

# Disable other node types for single-node setup
data:
  replicaCount: 0
coordinating:
  replicaCount: 0
ingest:
  replicaCount: 0

# Security disabled for local dev
security:
  enabled: false
  tls:
    restEncryption: false

# Ingress
ingress:
  enabled: true
  ingressClassName: traefik
  hostname: elasticsearch.localhost

# Metrics for Prometheus (optional)
metrics:
  enabled: false
