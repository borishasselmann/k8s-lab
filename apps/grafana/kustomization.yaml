apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - datasource.yaml
  - dashboard-provider.yaml

namespace: monitoring

# Generate ConfigMap from official Grafana community dashboards
# - K8s Node Metrics (ID: 22413) - https://grafana.com/grafana/dashboards/22413 (Grafana 11, 2025)
# - Kubernetes Cluster (ID: 7249) - https://grafana.com/grafana/dashboards/7249
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/kubernetes-cluster.json
      - dashboards/node-exporter.json
      - dashboards/nodes.json
      - dashboards/kubelet.json
      - dashboards/prometheus.json
      - dashboards/pod-total.json
      - dashboards/persistentvolumesusage.json
    options:
      disableNameSuffixHash: true
