# Bitnami Kibana for k3d
# Chart: https://github.com/bitnami/charts/tree/main/bitnami/kibana
# Chart version: 12.1.10

# Use bitnamilegacy images (Bitnami moved to paid registry Aug 2025)
image:
  registry: docker.io
  repository: bitnamilegacy/kibana
  tag: 9.1.2-debian-12-r0

# Init containers using bitnamilegacy images
volumePermissions:
  enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r51

# Connect to Elasticsearch
elasticsearch:
  hosts:
    - elasticsearch.logging.svc.cluster.local
  port: 9200
  security:
    auth:
      enabled: false
    tls:
      enabled: false

# Single replica for local dev
replicaCount: 1

# Resources - Kibana 9.x needs more memory
resources:
  requests:
    cpu: "100m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# Health probes - Kibana needs longer startup time
livenessProbe:
  enabled: true
  initialDelaySeconds: 180
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1

# Ingress
ingress:
  enabled: true
  ingressClassName: traefik
  hostname: kibana.localhost

# Disable persistence for local dev
persistence:
  enabled: false

# Security context
podSecurityContext:
  enabled: true
  fsGroup: 1001

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  ports:
    http: 5601

# ServiceAccount
serviceAccount:
  create: true
  automountServiceAccountToken: false

# Pod Disruption Budget - disabled for single replica
# Enable with minAvailable/maxUnavailable when scaling to multiple replicas
pdb:
  create: false
